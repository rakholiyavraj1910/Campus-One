<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00ADB5" />
    <link rel="manifest" href="/manifest.json" />
    <title>CampusOne — Government Polytechnic Ahmedabad</title>
    <meta name="description" content="Centralized college campus management and student intelligence portal for Government Polytechnic Ahmedabad. Timetables, attendance, notices, results, faculty, library and campus services." />
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // 1. Purge legacy ServiceWorker registrations and clear stale caches to prevent desktop white-screen
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        }).catch(function() {});
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        }).catch(function() {});
      }

      // 2. Global listener for module chunk load errors (automatically reloads with fresh assets)
      window.addEventListener('error', function(e) {
        if (e && e.message && (
          e.message.indexOf('Loading chunk') !== -1 ||
          e.message.indexOf('dynamically imported module') !== -1 ||
          e.message.indexOf('Unexpected token') !== -1
        )) {
          if (!sessionStorage.getItem('chunk_err_reload')) {
            sessionStorage.setItem('chunk_err_reload', 'true');
            window.location.reload();
          }
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-navy-950 dark:text-slate-100 antialiased selection:bg-brand-cyan/20 selection:text-brand-cyan transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
